<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>소수결 서바이벌</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #app { width: 100%; max-width: 400px; text-align: center; }
    .title { font-size: 28px; font-weight: bold; margin-bottom: 20px; }
    input[type="text"] {
      width: 100%; padding: 16px; font-size: 20px; border: 2px solid #4ecdc4;
      border-radius: 10px; background: #16213e; color: #eee; margin-bottom: 16px;
    }
    .btn {
      width: 100%; padding: 18px; font-size: 22px; font-weight: bold;
      border: none; border-radius: 12px; cursor: pointer; margin-bottom: 12px;
      min-height: 60px; transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-primary { background: #4ecdc4; color: #1a1a2e; }
    .btn-choice { background: #16213e; color: #eee; border: 2px solid #4ecdc4; }
    .btn-choice.selected { background: #4ecdc4; color: #1a1a2e; }
    .btn-choice:disabled { opacity: 0.5; }
    .timer { font-size: 64px; font-weight: bold; color: #ff6b6b; margin: 20px 0; }
    .status { font-size: 24px; color: #aaa; margin: 20px 0; }
    .eliminated { font-size: 36px; color: #ff6b6b; }
    .winner { font-size: 36px; color: #ffd93d; }
    .nickname-display { font-size: 20px; color: #4ecdc4; margin-bottom: 10px; }
    .prompt { font-size: 22px; font-weight: bold; color: #ffd93d; margin: 12px 0 20px; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
